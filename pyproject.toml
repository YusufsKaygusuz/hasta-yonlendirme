[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hasta-yonlendirme"
dynamic = ["version"]
description = "Low-cost, contactless patient wayfinding kiosk for hospitals: recognises the patient's face and shows the way to their appointment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuf Sami Kaygusuz" }]
maintainers = [{ name = "Yusuf Sami Kaygusuz" }]
requires-python = ">=3.10"
keywords = ["face-recognition", "raspberry-pi", "hospital", "wayfinding", "kiosk", "healthcare", "computer-vision"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Natural Language :: Turkish",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Face detection and encoding (dlib). On a Raspberry Pi, see docs/raspberry-pi.md before installing.
face = [
  "face_recognition>=1.3",
  "setuptools<85",  # face_recognition_models still imports pkg_resources
]
# USB / V4L2 cameras. On Raspberry Pi OS prefer the system package: sudo apt install python3-opencv
camera = ["opencv-python-headless>=4.8"]
mysql = ["mysql-connector-python>=8.0"]
all = ["hasta-yonlendirme[face,camera,mysql]"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
hasta-yonlendirme = "hasta_yonlendirme.cli:main"

[project.urls]
Homepage = "https://github.com/YusufsKaygusuz/hasta-yonlendirme"
Documentation = "https://github.com/YusufsKaygusuz/hasta-yonlendirme/tree/main/docs"
Issues = "https://github.com/YusufsKaygusuz/hasta-yonlendirme/issues"
Changelog = "https://github.com/YusufsKaygusuz/hasta-yonlendirme/blob/main/CHANGELOG.md"
"Project write-up" = "https://www.yusufskaygusuz.com/en/posts/yuz-tanima-hasta-yonlendirme/"

[tool.hatch.version]
path = "src/hasta_yonlendirme/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hasta_yonlendirme"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "config", "README.md", "README.tr.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["mysql: needs a MySQL server (set HY_TEST_MYSQL_HOST)"]

[tool.coverage.run]
source = ["hasta_yonlendirme"]
branch = true
# Hardware and GUI glue is exercised on a real kiosk, not in CI.
omit = ["*/kiosk/tk_ui.py", "*/camera.py", "*/recognition/dlib_backend.py", "*/storage/mysql.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "S", "N"]
ignore = [
  "S101",    # assert is fine in tests and for type narrowing
  "RUF001",  # Turkish text legitimately contains the dotless ı
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["hasta_yonlendirme"]

[[tool.mypy.overrides]]
module = ["face_recognition", "cv2", "picamera2", "mysql.*", "tomli"]
ignore_missing_imports = true
